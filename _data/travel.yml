# Add a country object to this list to light it up on the map.
# Photos are discovered from assets/img/travel/<folder>/ at build time.
visited_countries:
  - name: United States
    map_name: United States of America
    aliases: [United States of America, USA, US]
    folder: united-states
    accent: "#9fc3d4"
    note: "Desert light, mountain roads, coastlines, and the long arc of study and work."

  - name: Canada
    map_name: Canada
    folder: canada
    accent: "#c9d9e2"
    note: "A quiet northwest stop, held by water, glass, and mountain air."

  - name: China
    map_name: China
    aliases: [People's Republic of China]
    folder: china
    accent: "#f1cfa8"
    note: "Home ground, southern streets, old cities, and fast-moving skylines."

  - name: Japan
    map_name: Japan
    folder: japan
    accent: "#d6e7c8"
    note: "Tokyo rhythm, compact details, and small moments that stay bright."

  - name: Qatar
    map_name: Qatar
    folder: qatar
    accent: "#e7d4bd"
    note: "A warm crossing point between continents."

  - name: Ethiopia
    map_name: Ethiopia
    folder: ethiopia
    accent: "#cddbb4"
    note: "A different horizon, carried by altitude, history, and color."

  - name: Germany
    map_name: Germany
    folder: germany
    accent: "#d8d2e6"
    note: "European stations, old streets, and conference-season walks."

  - name: Spain
    map_name: Spain
    folder: spain
    accent: "#e8b9b1"
    note: "Warm stone, late light, and cities built for lingering."

  - name: Switzerland
    map_name: Switzerland
    folder: switzerland
    accent: "#bfd8d2"
    note: "Edges of mountains, clean air, and quiet geometry."

